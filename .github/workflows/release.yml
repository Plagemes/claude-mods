# Creates the git tag and the GitHub Release for a version, with the notes taken
# from that version's section of CHANGELOG.md. Run it from the Actions tab
# (or the API) after the release commit is on main.
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 2.0.0)'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notes from CHANGELOG.md
        env:
          VERSION: ${{ inputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG section for $VERSION"; exit 1; }
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Claude Mods v$VERSION" --notes-file notes.md
