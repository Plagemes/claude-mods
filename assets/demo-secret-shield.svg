<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="t d">
<title id="t">secret-shield demo</title>
<desc id="d">A Claude Code session where a Write call putting an AWS access key into config.ts is blocked by secret-shield, then Claude switches to an environment variable.</desc>
<style>.a{opacity:0;animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:linear}
@keyframes k0{0%,4.00%{width:0}18.00%,100%{width:720px}}
@keyframes k1{0%,4.00%{opacity:0}6.00%,94.00%{opacity:1}99.00%,100%{opacity:0}}
@keyframes k2{0%,22.00%{opacity:0}24.00%,94.00%{opacity:1}99.00%,100%{opacity:0}}
@keyframes k3{0%,30.00%{opacity:0}32.00%,94.00%{opacity:1}99.00%,100%{opacity:0}}
@keyframes k4{0%,42.00%{opacity:0}44.00%,94.00%{opacity:1}99.00%,100%{opacity:0}}
@keyframes k5{0%,64.00%{opacity:0}66.00%,94.00%{opacity:1}99.00%,100%{opacity:0}}
@keyframes k6{0%,74.00%{opacity:0}76.00%,94.00%{opacity:1}99.00%,100%{opacity:0}}</style>
<rect width="800" height="420" rx="10" fill="#1e1c19"/>
<rect x=".5" y=".5" width="799" height="419" rx="10" fill="none" stroke="#2a1f17"/>
<rect width="800" height="36" rx="10" fill="#171613"/><rect y="26" width="800" height="10" fill="#171613"/>
<circle cx="22" cy="18" r="6" fill="#ee8a4f" opacity=".9"/><circle cx="42" cy="18" r="6" fill="#878073" opacity=".6"/><circle cx="62" cy="18" r="6" fill="#878073" opacity=".4"/>
<text x="400" y="23" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#878073">claude  ·  secret-shield</text>
<text x="40" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#878073">Claude Code</text>
<clipPath id="ck0"><rect x="40" y="76" height="22" width="0" style="animation:k0 10s steps(40,end) infinite"/></clipPath><g clip-path="url(#ck0)"><g class="a" style="animation-name:k1"><text x="40" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><tspan fill="#ee8a4f">&gt;</tspan><tspan fill="#eee7db"> add my AWS creds to config.ts so the deploy works</tspan></text></g></g><g class="a" style="animation-name:k2"><text x="40" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#aba496"><tspan fill="#ee8a4f">●</tspan> I'll write the key into config.ts.</text></g><g class="a" style="animation-name:k3"><rect x="40" y="140" width="720" height="62" rx="6" fill="#171613" stroke="#2a1f17"/><text x="56" y="162" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#eee7db"><tspan fill="#ee8a4f">●</tspan> Write(<tspan fill="#aba496">config.ts</tspan>)</text><text x="56" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#878073">2  export const key = '<tspan fill="#ee8a4f">AKIAZ7Q3M9XK2P4W8L5N</tspan>'</text></g><g class="a" style="animation-name:k4"><rect x="40" y="214" width="720" height="104" rx="6" fill="#2a1f17" stroke="#ee8a4f"/><rect x="40" y="214" width="4" height="104" rx="2" fill="#ee8a4f"/><text x="60" y="238" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#ee8a4f" font-weight="bold">✕ BLOCKED  tool.call Write</text><text x="60" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#eee7db">secret-shield: refusing to write config.ts; it looks like it contains a secret.</text><text x="60" y="282" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#eee7db">  line 2: AWS access key -&gt; export const key = '<tspan fill="#ee8a4f">AKIA…[20]</tspan>'</text><text x="60" y="302" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#aba496">Use an environment variable or a secret manager and reference it by name.</text></g><g class="a" style="animation-name:k5"><text x="40" y="346" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#aba496"><tspan fill="#ee8a4f">●</tspan> Blocked. Using <tspan fill="#eee7db">process.env.AWS_ACCESS_KEY_ID</tspan> instead.</text></g><g class="a" style="animation-name:k6"><text x="40" y="372" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#878073">The secret never touched disk.</text></g>
</svg>